<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Return Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-success">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Return Book from Reader</h4>
                </div>
                <div class="card-body">

                    <!-- Сообщение об успехе -->
                    <div th:if="${param.success}" class="alert alert-success">
                        Book returned successfully! Database updated.
                    </div>

                    <form th:action="@{/librarian/return}" method="post">

                        <div class="mb-4">
                            <label class="form-label fw-bold">Select Reader:</label>
                            <select name="userId" class="form-select" size="5" required>
                                <option th:each="u : ${users}" th:value="${u.id}"
                                        th:text="${u.username} + ' (Books taken: ' + ${#lists.size(u.issuedBooks)} + ')'">
                                </option>
                            </select>
                            <div class="form-text text-muted">Select the user who is returning a book.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Select Book to Return:</label>
                            <select name="bookId" class="form-select" size="5" required>
                                <option th:each="b : ${books}" th:value="${b.id}"
                                        th:text="${b.title} + ' (' + ${b.author} + ')'">
                                </option>
                            </select>
                            <div class="form-text text-muted">Make sure the user actually has this book.</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Confirm Return</button>
                            <a href="/librarian/books" class="btn btn-outline-secondary">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
