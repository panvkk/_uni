<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Order Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand" href="/reader/books"><i class="bi bi-book-half"></i> Library System</a>
    <div class="d-flex">
      <a href="/reader/books" class="btn btn-outline-light btn-sm me-2">Catalog</a>
      <a href="/reader/account" class="btn btn-outline-light btn-sm me-2">My Account</a>
      <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <h3 class="mb-0 text-primary">Order a Book</h3>
    </div>
    <div class="card-body">

      <!-- Сообщение об успешном старте заказа -->
      <div th:if="${param.success}" class="alert alert-success">
        Order request received! The librarian is processing it in the background.
        Check your account in a few seconds.
      </div>

      <!-- Шаг 1: Поиск по жанру -->
      <form th:action="@{/reader/order}" method="get" class="mb-4">
        <label class="form-label fw-bold">Step 1: Search by Category (Genre)</label>
        <div class="input-group">
          <input type="text" name="genre" class="form-control" placeholder="E.g. Fantasy, Novel, Satire..." th:value="${selectedGenre}" required>
          <button type="submit" class="btn btn-primary">Find Books</button>
        </div>
      </form>

      <hr/>

      <!-- Шаг 2: Выбор книги -->
      <div th:if="${books != null}">
        <h5 class="mb-3">Available Books in Category:</h5>

        <div th:if="${#lists.isEmpty(books)}" class="text-muted">No books found for this category.</div>

        <div class="list-group">
          <div th:each="book : ${books}" class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <h5 class="mb-1" th:text="${book.title}"></h5>
              <small class="text-muted" th:text="${book.author} + ' | ' + ${book.year}"></small>
            </div>

            <!-- Кнопка заказа (только если есть в наличии) -->
            <div th:if="${book.availableCopies > 0}">
              <form th:action="@{/reader/order}" method="post">
                <input type="hidden" name="bookId" th:value="${book.id}"/>
                <button type="submit" class="btn btn-success btn-sm">
                  <i class="bi bi-cart-plus"></i> Order Now
                </button>
              </form>
            </div>
            <div th:if="${book.availableCopies == 0}">
              <span class="badge bg-secondary">Out of Stock</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
