<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Active Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Return Desk</span>
        <a href="/librarian/books" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
</nav>

<div class="container">

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
        Book returned successfully!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="bi bi-collection"></i> All Active Loans</h4>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Reader</th>
                    <th>Book Title (Author)</th>
                    <th style="width: 150px;">Action</th>
                </tr>
                </thead>
                <tbody>
                <!-- Перебираем всех пользователей -->
                <th:block th:each="user : ${users}">
                    <!-- Перебираем книги каждого пользователя -->
                    <tr th:each="bookStr : ${user.issuedBooks}">

                        <!-- Имя пользователя -->
                        <td>
                            <i class="bi bi-person-circle text-secondary"></i>
                            <span class="fw-bold" th:text="${user.username}"></span>
                        </td>

                        <!-- Название книги -->
                        <td th:text="${bookStr}"></td>

                        <!-- Кнопка возврата -->
                        <td>
                            <form th:action="@{/librarian/return}" method="post">
                                <input type="hidden" name="userId" th:value="${user.id}"/>
                                <input type="hidden" name="bookString" th:value="${bookStr}"/>
                                <button type="submit" class="btn btn-success btn-sm w-100">
                                    <i class="bi bi-check-lg"></i> Return
                                </button>
                            </form>
                        </td>
                    </tr>
                </th:block>

                <!-- Если вообще ни у кого нет книг -->
                <tr th:if="${#lists.isEmpty(users)}"> <!-- Это проверка списка юзеров, но лучше проверить есть ли книги -->
                    <td colspan="3" class="text-center py-4 text-muted">No active loans found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
