<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Register - Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="width: 450px;">
  <div class="card-body">
    <h3 class="text-center mb-4 text-success">Create Account</h3>

    <div class="alert alert-info text-center" role="alert">
      <small>Hint: Include <strong>"admin"</strong> in username to become a Librarian.</small>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" th:field="*{username}" class="form-control" placeholder="Choose a username" required/>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" th:field="*{password}" class="form-control" placeholder="Create a password" required/>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2">Register & Login</button>
    </form>

    <div class="text-center mt-3">
      <a href="/login" class="text-decoration-none">Already have an account? Login</a>
    </div>
  </div>
</div>

</body>
</html>
