<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Readers List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Library Administration</span>
    <a href="/librarian/books" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <h3 class="mb-0">Registered Users</h3>
    </div>
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Role</th>
          <th>Issued Books</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reader : ${readers}">
          <td th:text="${reader.id}"></td>
          <td>
            <i class="bi bi-person-fill"></i> <span th:text="${reader.username}"></span>
          </td>
          <td>
                            <span th:class="${reader.role == 'ROLE_LIBRARIAN' ? 'badge bg-danger' : 'badge bg-info text-dark'}"
                                  th:text="${reader.role}"></span>
          </td>
          <td>
            <span th:if="${#lists.isEmpty(reader.issuedBooks)}" class="text-muted fst-italic">No active loans</span>
            <ul th:if="${not #lists.isEmpty(reader.issuedBooks)}" class="mb-0 ps-3">
              <li th:each="bookName : ${reader.issuedBooks}" th:text="${bookName}"></li>
            </ul>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
